name: Deploy to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.release.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A399C1: ${{ secrets.A399C1 }}
          B68447: ${{ secrets.B68447 }}
        run: |
          python3 -c "
          import sys, pathlib, os
          meta_a = os.environ.get('A399C1', '')
          meta_b = os.environ.get('B68447', '')
          page = pathlib.Path('index.html')
          src = page.read_text(encoding='utf-8')
          out = src
          if meta_a:
              out = out.replace('<!-- 717035ffd767804e6a6324ae46bd86560815 -->', meta_a)
          if meta_b:
              out = out.replace('<!-- 96f039e8d2a371de933578c57cd9eb -->', meta_b)
          if out == src and (meta_a or meta_b):
              sys.exit(1)
          if out != src:
              page.write_text(out, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: release
        uses: actions/deploy-pages@v4
